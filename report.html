<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internship Progress — Shared View</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --rose:#ECA6C4; --rose-deep:#D9769E; --amethyst:#A98BDB; --amethyst-deep:#8467C2;
    --amber:#EFC07E; --amber-deep:#D99A3E; --mint:#8FDCC4; --mint-deep:#5CBE9E;
    --coral:#E8917E; --coral-deep:#CC6650; --ink:#3A2E42; --ink-soft:#7A6D85;
    --glass: rgba(255,255,255,0.32); --glass-border: rgba(255,255,255,0.55); --radius:20px;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:'Inter', sans-serif; color: var(--ink); min-height:100vh;
    background:
      radial-gradient(circle at 8% 12%, rgba(236,166,196,0.5), transparent 40%),
      radial-gradient(circle at 92% 8%, rgba(169,139,219,0.45), transparent 42%),
      radial-gradient(circle at 15% 85%, rgba(143,220,196,0.38), transparent 40%),
      linear-gradient(160deg, #F7E4DE 0%, #EDD9EE 35%, #DCE0EF 65%, #E8ECE4 100%);
    background-attachment: fixed;
  }
  .glass{ background: var(--glass); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%); border:1px solid var(--glass-border); border-radius: var(--radius); box-shadow: 0 8px 32px rgba(80,50,90,0.12); }
  .wrap{ max-width: 820px; margin: 0 auto; padding: 26px 20px 60px; }
  .banner{ display:flex; align-items:center; justify-content:center; gap:8px; padding:10px 16px; border-radius:12px; background: rgba(217,154,62,0.18); border:1px solid rgba(217,154,62,0.3); font-family:'JetBrains Mono'; font-size:11px; color: var(--amber-deep); margin-bottom:16px; text-align:center; flex-wrap:wrap; }
  .live-dot{ width:7px; height:7px; border-radius:50%; background: var(--mint-deep); animation: pulse 1.6s infinite ease-in-out; flex-shrink:0; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }
  .refresh-btn{ font-family:'JetBrains Mono'; font-size:10.5px; color: var(--amber-deep); background: rgba(255,255,255,0.5); border:1px solid rgba(217,154,62,0.35); border-radius:8px; padding:3px 9px; cursor:pointer; }
  .refresh-btn:hover{ background: rgba(255,255,255,0.75); }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:16px; padding:16px 22px; margin-bottom:18px; flex-wrap:wrap; }
  .topbar h1{ font-family:'Quicksand'; font-weight:700; font-size:18px; margin:0; }
  .topbar .sub{ font-family:'JetBrains Mono'; font-size:10px; color: var(--ink-soft); }
  .stats{ display:flex; gap:10px; flex-wrap:wrap; }
  .stat{ background: rgba(255,255,255,0.4); border-radius:12px; padding:7px 13px; font-family:'Quicksand'; font-weight:700; font-size:12.5px; }
  .stat span{ display:block; font-family:'JetBrains Mono'; font-weight:400; font-size:9px; color: var(--ink-soft); margin-top:2px; }

  .week-nav{ display:flex; gap:8px; overflow-x:auto; padding: 4px 2px 14px; }
  .week-chip{ flex-shrink:0; font-family:'Quicksand'; font-weight:600; font-size:12px; padding:8px 16px; border-radius:20px; cursor:pointer; background: rgba(255,255,255,0.3); border:1px solid rgba(255,255,255,0.5); }
  .week-chip.active{ background: linear-gradient(135deg, var(--rose), var(--amethyst)); color:#fff; border-color:transparent; }
  .week-chip.cleared::after{ content:' ✓'; }

  .head-card{ padding:18px 22px; margin-bottom:16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .head-card h2{ font-family:'Quicksand'; font-weight:700; font-size:19px; margin:0 0 4px; }
  .head-card .range{ font-family:'JetBrains Mono'; font-size:10.5px; color: var(--ink-soft); }
  .wk-filter{
    border:1px solid rgba(150,110,160,0.25); background: rgba(255,255,255,0.5); padding:8px 12px;
    font-family:'JetBrains Mono'; font-size:11px; border-radius:10px; color: var(--ink); cursor:pointer;
  }

  .task-card{ padding: 18px 22px; margin-bottom: 16px; }
  .wk-item{ padding: 12px 10px; margin-bottom:8px; border-radius:12px; background: rgba(255,255,255,0.28); border:1px solid rgba(255,255,255,0.4); border-left: 3px solid var(--ink-soft); }
  .wk-item:last-child{ margin-bottom:0; }
  .wk-item.bs-completed{ background: rgba(143,220,196,0.22); border-left-color: var(--mint-deep); }
  .wk-item.bs-completed .wk-text{ text-decoration: line-through; color: var(--ink-soft); }
  .wk-item.bs-pending{ border-left-color: var(--ink-soft); }
  .wk-item.bs-started{ border-left-color: var(--amethyst-deep); }
  .wk-item.bs-in_progress{ border-left-color: var(--amber-deep); }
  .wk-item.bs-procrastinated{ border-left-color: var(--coral-deep); }
  .wk-item.bs-stuck{ border-left-color: var(--coral-deep); }
  .wk-item.bs-review{ border-left-color: var(--amethyst-deep); }
  .wk-item.bs-ghosted{ border-left-color: var(--ink-soft); opacity:0.65; }
  .wk-text{ font-size:13.5px; margin-bottom:7px; }
  .wk-meta{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .pri-tag{ font-family:'JetBrains Mono'; font-size:9px; padding:2px 8px; border-radius:10px; text-transform:uppercase; }
  .pri-low{ background: rgba(143,220,196,0.3); color: var(--mint-deep); }
  .pri-medium{ background: rgba(239,192,126,0.35); color: var(--amber-deep); }
  .pri-high{ background: rgba(232,145,126,0.35); color: var(--coral-deep); }
  .status-tag{ font-family:'JetBrains Mono'; font-size:9px; padding:2px 8px; border-radius:10px; background: rgba(150,110,160,0.15); color: var(--ink-soft); }
  .deadline-tag{ font-family:'JetBrains Mono'; font-size:9px; color: var(--ink-soft); background: rgba(150,110,160,0.12); padding:2px 8px; border-radius:10px; }
  .deadline-tag.overdue{ color: var(--coral-deep); background: rgba(232,145,126,0.25); }
  .attach-chip{ display:inline-flex; align-items:center; gap:5px; font-family:'JetBrains Mono'; font-size:9px; color: var(--amethyst-deep); background: rgba(169,139,219,0.18); padding:2px 8px; border-radius:8px; text-decoration:none; }
  .wk-empty{ font-family:'JetBrains Mono'; font-size:12px; color: var(--ink-soft); padding: 10px 4px; }

  .reflect-view{ padding:18px 22px; margin-bottom:16px; }
  .reflect-view h3{ font-family:'Quicksand'; font-weight:700; font-size:14px; margin:0 0 10px; }
  .reflect-view .rlabel{ font-family:'Quicksand'; font-weight:700; font-size:11.5px; margin-bottom:3px; }
  .reflect-view p{ font-size:12.5px; margin:0 0 12px; white-space:pre-wrap; color: var(--ink); }

  .skill-card{ padding: 16px 18px; margin-bottom:10px; }
  .skill-top{ display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .skill-top .n{ font-family:'Quicksand'; font-weight:700; font-size:13.5px; }
  .skill-top .t{ font-family:'JetBrains Mono'; font-size:9.5px; background: rgba(169,139,219,0.25); color: var(--amethyst-deep); padding:3px 9px; border-radius:20px; text-transform:uppercase; }
  .skill-entry{ font-size:11.5px; padding:4px 0; border-bottom:1px solid rgba(150,110,160,0.1); }
  .skill-entry:last-child{ border-bottom:none; }
  .skill-entry b{ font-family:'JetBrains Mono'; font-weight:600; font-size:9.5px; color: var(--ink-soft); margin-right:6px; }

  .loading, .empty{ font-family:'JetBrains Mono'; font-size:12px; color: var(--ink-soft); text-align:center; padding:50px 10px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="banner">
    <span class="live-dot"></span>
    <span id="liveLabel">Live — checking for updates…</span>
    <button class="refresh-btn" id="refreshBtn">Refresh now</button>
  </div>
  <div id="app"><div class="loading">Loading progress…</div></div>
</div>

<script>
const gistId = new URLSearchParams(location.search).get('gist');
const BASE_POLL_MS = 90000; // 90s — GitHub allows only 60 unauthenticated requests/hour per IP,
                             // so this stays well under that even with manual refreshes mixed in.
const MAX_POLL_MS = 8 * 60000; // back off up to 8 min between retries on repeated failure
const CACHE_KEY = 'internship-report-cache-' + (gistId || 'none');
let report = null;
let activeWeekIdx = 0;
let filterValue = 'all';
let pollTimer = null;
let currentPollMs = BASE_POLL_MS;
let consecutiveFailures = 0;

const STATUS_LABEL = {
  pending: '⏳ Pending', started: '🚀 Started', in_progress: '🔄 In Progress',
  procrastinated: '🙈 Procrastinated', stuck: '🧱 Stuck', review: '👀 In Review',
  completed: '✅ Completed', ghosted: '👻 Ghosted'
};

function fmtDate(iso){ const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'}); }
function fmtDateFull(iso){ const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); }
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str||''; return d.innerHTML; }
function pad2(n){ return String(n).padStart(2,'0'); }
function isoOf(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }

function setLive(text){ document.getElementById('liveLabel').textContent = text; }

function readCache(){
  try{ const raw = localStorage.getItem(CACHE_KEY); return raw ? JSON.parse(raw) : null; } catch(e){ return null; }
}
function writeCache(obj){
  try{ localStorage.setItem(CACHE_KEY, JSON.stringify(obj)); } catch(e){ /* ignore quota errors */ }
}

async function load(isPoll){
  const app = document.getElementById('app');
  if(!gistId){ app.innerHTML = '<div class="empty">No report specified. Ask for a link that includes ?gist=…</div>'; setLive('Not connected'); return; }
  if(!isPoll && !report) setLive('Live — checking for updates…');
  try{
    const res = await fetch('https://api.github.com/gists/' + gistId + '?_=' + Date.now());
    if(res.status === 403 && res.headers.get('x-ratelimit-remaining') === '0'){
      const resetHeader = res.headers.get('x-ratelimit-reset');
      const resetAt = resetHeader ? new Date(parseInt(resetHeader,10) * 1000) : null;
      throw Object.assign(new Error('GitHub rate limit reached'), { rateLimited: true, resetAt });
    }
    if(!res.ok) throw new Error('Could not load report (' + res.status + ')');
    const data = await res.json();
    const file = Object.values(data.files || {}).find(f => f.filename === 'internship-quest-report.json') || Object.values(data.files || {})[0];
    if(!file || !file.content) throw new Error('Report file not found in that gist');
    report = JSON.parse(file.content);
    writeCache({ report, fetchedAt: Date.now() });
    consecutiveFailures = 0;
    currentPollMs = BASE_POLL_MS;

    if(!isPoll){
      const today = isoOf(new Date());
      const match = report.weeks.findIndex(w => today >= w.start && today <= w.end);
      activeWeekIdx = match >= 0 ? match : Math.max(0, report.weeks.length - 1);
    }
    render();
    const t = new Date();
    setLive('Live — updated ' + pad2(t.getHours()) + ':' + pad2(t.getMinutes()));
  } catch(e){
    console.error(e);
    consecutiveFailures++;
    currentPollMs = Math.min(MAX_POLL_MS, BASE_POLL_MS * Math.pow(2, consecutiveFailures - 1));

    if(!report){
      // Nothing on screen yet this session — try the local cache before giving up.
      const cached = readCache();
      if(cached){
        report = cached.report;
        const today = isoOf(new Date());
        const match = report.weeks.findIndex(w => today >= w.start && today <= w.end);
        activeWeekIdx = match >= 0 ? match : Math.max(0, report.weeks.length - 1);
        render();
        const cachedAt = new Date(cached.fetchedAt);
        setLive('Showing last known data from ' + pad2(cachedAt.getHours()) + ':' + pad2(cachedAt.getMinutes()) + ' — reconnecting…');
      } else if(e.rateLimited){
        app.innerHTML = '<div class="empty">GitHub has briefly rate-limited this link (too many checks in the last hour). It will start working again automatically shortly — no action needed.</div>';
        setLive('Rate limited — retrying automatically');
      } else {
        app.innerHTML = '<div class="empty">This report could not be loaded. It may have been unpublished, or the link is incorrect.</div>';
        setLive('Could not refresh — will retry');
      }
    } else {
      // We already have something on screen — keep showing it, just note the hiccup quietly.
      setLive(e.rateLimited ? 'Rate limited — will retry shortly' : 'Could not refresh — will retry');
    }
  }
  clearTimeout(pollTimer);
  pollTimer = setTimeout(() => load(true), currentPollMs);
}

function attachmentChipHtml(t){
  if(!t.attachment) return '';
  if(t.attachment.type === 'link'){
    let host = t.attachment.url;
    try{ host = new URL(t.attachment.url).hostname.replace('www.',''); } catch(e){}
    return `<a class="attach-chip" href="${escapeHtml(t.attachment.url)}" target="_blank" rel="noopener">🔗 ${escapeHtml(host)}</a>`;
  }
  if(t.attachment.type === 'file'){
    return `<a class="attach-chip" href="${t.attachment.dataUrl}" download="${escapeHtml(t.attachment.name)}">📎 ${escapeHtml(t.attachment.name)}</a>`;
  }
  return '';
}

function render(){
  const app = document.getElementById('app');
  const w = report.weeks[activeWeekIdx];
  const today = isoOf(new Date());
  const now = new Date();
  const nowTime = pad2(now.getHours()) + ':' + pad2(now.getMinutes());

  let html = `
    <div class="topbar glass">
      <div><h1>Internship Progress</h1><div class="sub">Last updated ${new Date(report.generatedAt).toLocaleString('en-GB', { day:'2-digit', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' })}</div></div>
      <div class="stats">
        <div class="stat">Level ${report.level}<span>${escapeHtml(report.rank || '')}</span></div>
        <div class="stat">${report.xp} XP<span>total earned</span></div>
        <div class="stat">${report.streak}<span>week streak</span></div>
      </div>
    </div>
    <div class="week-nav">
      ${report.weeks.map((wk,i) => `<div class="week-chip${i===activeWeekIdx?' active':''}${wk.cleared?' cleared':''}" data-idx="${i}">Week ${wk.weekNum}</div>`).join('')}
    </div>
  `;

  if(w){
    html += `<div class="head-card glass">
      <div><h2>Week ${w.weekNum}</h2><div class="range">${fmtDateFull(w.start)} – ${fmtDateFull(w.end)}</div></div>
      <select class="wk-filter" id="filterSelect">
        <option value="all" ${filterValue==='all'?'selected':''}>All tasks</option>
        ${Object.keys(STATUS_LABEL).map(k => `<option value="${k}" ${filterValue===k?'selected':''}>${STATUS_LABEL[k]}</option>`).join('')}
      </select>
    </div>`;

    let tasks = [...(w.weeklyTasks || [])];
    if(filterValue !== 'all') tasks = tasks.filter(t => t.status === filterValue);
    const order = {high:0, medium:1, low:2};
    tasks.sort((a,b) => order[a.priority||'medium'] - order[b.priority||'medium']);

    html += `<div class="task-card glass">`;
    if(tasks.length === 0){
      html += `<div class="wk-empty">No tasks match this filter.</div>`;
    } else {
      tasks.forEach(t => {
        const overdue = t.deadline && t.status !== 'completed' && (t.deadline < today || (t.deadline === today && t.time && t.time < nowTime));
        const deadlineLabel = t.deadline ? fmtDate(t.deadline) + (t.time ? ' · ' + t.time : '') : '';
        html += `<div class="wk-item bs-${t.status || 'pending'}">
          <div class="wk-text">${escapeHtml(t.text)}</div>
          <div class="wk-meta">
            <span class="pri-tag pri-${t.priority||'medium'}">${t.priority||'medium'}</span>
            <span class="status-tag">${STATUS_LABEL[t.status] || t.status || 'Pending'}</span>
            ${t.deadline ? `<span class="deadline-tag${overdue?' overdue':''}">${overdue?'overdue · ':'due '}${deadlineLabel}</span>` : ''}
            ${attachmentChipHtml(t)}
          </div>
        </div>`;
      });
    }
    html += `</div>`;

    if(w.reflection && (w.reflection.did || w.reflection.learned)){
      html += `<div class="reflect-view glass"><h3>Weekly reflection</h3>`;
      if(w.reflection.did) html += `<div class="rlabel">📝 What she did</div><p>${escapeHtml(w.reflection.did)}</p>`;
      if(w.reflection.learned) html += `<div class="rlabel">💡 What she learned</div><p>${escapeHtml(w.reflection.learned)}</p>`;
      html += `</div>`;
    }
  }

  if((report.skills||[]).length){
    html += `<div class="head-card glass" style="margin-bottom:10px;"><h2 style="font-size:16px;">Skill Journal</h2></div>`;
    report.skills.forEach(s => {
      html += `<div class="skill-card glass">
        <div class="skill-top"><span class="n">${escapeHtml(s.name)}</span><span class="t">${escapeHtml(s.tier)}</span></div>`;
      if(!s.entries || s.entries.length === 0){
        html += `<div class="skill-entry" style="opacity:0.6;">No entries logged yet.</div>`;
      } else {
        s.entries.forEach(en => {
          html += `<div class="skill-entry"><b>${fmtDate(en.date)}</b>${escapeHtml(en.note)}</div>`;
        });
      }
      html += `</div>`;
    });
  }

  app.innerHTML = html;

  document.querySelectorAll('.week-chip').forEach(el => {
    el.addEventListener('click', () => { activeWeekIdx = parseInt(el.dataset.idx, 10); render(); });
  });
  const filterSelect = document.getElementById('filterSelect');
  if(filterSelect){
    filterSelect.addEventListener('change', (e) => { filterValue = e.target.value; render(); });
  }
}

document.getElementById('refreshBtn').addEventListener('click', () => {
  consecutiveFailures = 0;
  currentPollMs = BASE_POLL_MS;
  load(false);
});
document.addEventListener('visibilitychange', () => { if(!document.hidden) load(true); });

load(false);
</script>
</body>
</html>
