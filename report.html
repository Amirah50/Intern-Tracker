<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Internship Quest — Shared View</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --rose: #ECA6C4; --rose-deep: #D9769E;
    --amethyst: #A98BDB; --amethyst-deep: #8467C2;
    --amber: #EFC07E; --amber-deep: #D99A3E;
    --mint: #8FDCC4; --mint-deep: #5CBE9E;
    --coral: #E8917E; --coral-deep: #CC6650;
    --ink: #3A2E42; --ink-soft: #7A6D85;
    --glass: rgba(255,255,255,0.30);
    --glass-border: rgba(255,255,255,0.55);
    --radius: 20px;
  }
  *{ box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    margin:0; font-family:'Inter', sans-serif; color: var(--ink);
    background:
      radial-gradient(circle at 8% 12%, rgba(236,166,196,0.5), transparent 40%),
      radial-gradient(circle at 92% 8%, rgba(169,139,219,0.45), transparent 42%),
      radial-gradient(circle at 15% 85%, rgba(143,220,196,0.38), transparent 40%),
      radial-gradient(circle at 88% 90%, rgba(239,192,126,0.38), transparent 42%),
      linear-gradient(160deg, #F7E4DE 0%, #EDD9EE 35%, #DCE0EF 65%, #E8ECE4 100%);
    background-attachment: fixed; min-height:100vh; overflow-x:hidden;
  }
  .bubble{ position:fixed; border-radius:50%; background: radial-gradient(circle at 32% 28%, rgba(255,255,255,0.85), rgba(255,255,255,0.05) 60%); pointer-events:none; z-index:0; }
  .glass{
    background: var(--glass); backdrop-filter: blur(18px) saturate(140%); -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--glass-border); border-radius: var(--radius);
    box-shadow: 0 8px 32px rgba(80,50,90,0.12), inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .app{ position:relative; z-index:1; max-width: 1280px; margin:0 auto; padding: 26px 22px 60px; }

  .banner{ display:flex; align-items:center; justify-content:center; gap:8px; padding:9px 16px; border-radius:12px; background: rgba(92,190,158,0.18); border:1px solid rgba(92,190,158,0.35); font-family:'JetBrains Mono'; font-size:11px; color: var(--mint-deep); margin-bottom:16px; text-align:center; }
  .live-dot{ width:6px; height:6px; border-radius:50%; background: var(--mint-deep); animation: pulse 1.4s infinite ease-in-out; }
  @keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:0.3; } }

  .topbar{ display:flex; align-items:center; justify-content:space-between; gap:18px; padding: 16px 24px; margin-bottom:20px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .brand .orb{ width:38px; height:38px; border-radius:50%; background: linear-gradient(135deg, var(--rose), var(--amethyst)); box-shadow: 0 0 0 4px rgba(255,255,255,0.4), 0 4px 14px rgba(150,100,180,0.35); }
  .brand h1{ font-family:'Quicksand'; font-weight:700; font-size:18px; margin:0; }
  .brand .tag{ font-family:'JetBrains Mono'; font-size:10px; color: var(--ink-soft); }

  .stats-row{ display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .level-badge{ display:flex; align-items:center; gap:9px; }
  .level-ring{ position:relative; width:48px; height:48px; }
  .level-text .lt-top{ font-size:12px; font-weight:600; font-family:'Quicksand'; }
  .level-text .lt-sub{ font-family:'JetBrains Mono'; font-size:9.5px; color: var(--ink-soft); }
  .streak-badge{ display:flex; align-items:center; gap:6px; background: linear-gradient(135deg, rgba(239,192,126,0.5), rgba(217,118,158,0.35)); padding:7px 13px; border-radius: 30px; border:1px solid rgba(255,255,255,0.6); }
  .streak-badge span{ font-family:'JetBrains Mono'; font-size:11.5px; font-weight:600; }

  .nav-pills{ display:flex; gap:10px; margin-bottom:20px; }
  .nav-pills button{
    font-family:'Quicksand'; font-weight:600; font-size:13.5px; padding: 10px 20px; border-radius: 30px; cursor:pointer;
    background: rgba(255,255,255,0.28); border:1px solid rgba(255,255,255,0.5); color: var(--ink); backdrop-filter: blur(10px);
  }
  .nav-pills button.active{ background: linear-gradient(135deg, var(--rose), var(--amethyst)); color:#fff; border-color:transparent; box-shadow: 0 6px 18px rgba(160,100,170,0.35); }

  .layout{ display:flex; gap:20px; align-items:flex-start; }

  .week-rail{ width: 250px; flex-shrink:0; padding: 18px 12px; max-height: 720px; overflow-y:auto; }
  .week-rail::-webkit-scrollbar{ width:5px; }
  .week-rail::-webkit-scrollbar-thumb{ background: rgba(150,110,160,0.3); border-radius:4px; }

  .side-tabs{ display:flex; gap:6px; margin: 2px 4px 14px; }
  .side-tabs button{
    flex:1; font-family:'Quicksand'; font-weight:600; font-size:11.5px; padding:7px 4px; border-radius:20px; cursor:pointer;
    background: rgba(255,255,255,0.3); border:1px solid rgba(255,255,255,0.5); color: var(--ink-soft);
  }
  .side-tabs button.active{ background: linear-gradient(135deg, var(--rose), var(--amethyst)); color:#fff; border-color:transparent; }
  .side-view{ display:none; }
  .side-view.active{ display:block; }

  .cal-nav{ display:flex; align-items:center; justify-content:space-between; margin: 2px 4px 10px; }
  .cal-nav button{ background: rgba(255,255,255,0.35); border:1px solid rgba(255,255,255,0.5); border-radius:8px; width:24px; height:24px; cursor:pointer; font-size:13px; color: var(--ink); line-height:1; }
  .cal-nav span{ font-family:'Quicksand'; font-weight:700; font-size:12.5px; }
  .cal-grid{ display:grid; grid-template-columns: repeat(7, 1fr); gap:3px; margin-bottom:16px; }
  .cal-wd{ font-family:'JetBrains Mono'; font-size:8.5px; color: var(--ink-soft); text-align:center; padding-bottom:3px; }
  .cal-day{ position:relative; aspect-ratio: 1/1; display:flex; align-items:center; justify-content:center; font-family:'Inter'; font-size:10.5px; color: var(--ink); border-radius:7px; background: rgba(255,255,255,0.18); }
  .cal-day.out-month{ opacity:0.28; }
  .cal-day.has-tasks{ cursor:pointer; background: rgba(255,255,255,0.4); font-weight:600; }
  .cal-day.today{ box-shadow: inset 0 0 0 1.5px var(--amethyst-deep); }
  .cal-day.cur-week{ background: rgba(236,166,196,0.35); }
  .cal-day.all-done{ background: rgba(143,220,196,0.4); }
  .cal-dot{ position:absolute; bottom:2.5px; width:4px; height:4px; border-radius:50%; }
  .dot-high{ background: var(--coral-deep); } .dot-medium{ background: var(--amber-deep); } .dot-low{ background: var(--mint-deep); } .dot-done{ background: var(--mint-deep); }

  .deadline-list-wrap h4{ font-family:'Quicksand'; font-size:11px; text-transform:uppercase; letter-spacing:0.05em; color: var(--ink-soft); margin: 0 4px 10px; }
  .deadline-item{ display:flex; align-items:center; gap:8px; padding:7px 8px; margin-bottom:5px; border-radius:10px; cursor:pointer; background: rgba(255,255,255,0.28); border:1px solid rgba(255,255,255,0.4); }
  .deadline-item.overdue{ border-color: rgba(204,102,80,0.4); }
  .deadline-item .dl-date{ font-family:'JetBrains Mono'; font-size:9px; color: var(--ink-soft); width:38px; flex-shrink:0; line-height:1.3; }
  .deadline-item .dl-time{ font-family:'JetBrains Mono'; font-size:9px; color: var(--ink-soft); }
  .deadline-item .dl-body{ flex:1; min-width:0; }
  .deadline-item .dl-text{ font-size:11px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .deadline-item .dl-dot{ width:6px; height:6px; border-radius:50%; flex-shrink:0; }
  .deadline-empty{ font-family:'JetBrains Mono'; font-size:10.5px; color: var(--ink-soft); padding:4px 8px; }

  .path{ position:relative; padding-left: 8px; }
  .path::before{ content:''; position:absolute; left: 23px; top:6px; bottom:6px; width:2px; background: repeating-linear-gradient(180deg, rgba(150,110,160,0.35) 0 6px, transparent 6px 12px); }
  .node{ position:relative; display:flex; align-items:center; gap:10px; padding: 8px 6px; margin-bottom:4px; border-radius:14px; cursor:pointer; z-index:1; }
  .node:hover{ background: rgba(255,255,255,0.35); }
  .node.active{ background: linear-gradient(135deg, rgba(236,166,196,0.5), rgba(169,139,219,0.35)); }
  .node .circ{ width:30px; height:30px; border-radius:50%; flex-shrink:0; display:flex; align-items:center; justify-content:center; background: linear-gradient(145deg, #fff, #E6DFF2); font-family:'Quicksand'; font-weight:700; font-size:11px; color: var(--amethyst-deep); border: 2px solid rgba(255,255,255,0.8); box-shadow: 0 2px 6px rgba(120,80,140,0.18); }
  .node.cleared .circ{ background: linear-gradient(145deg, var(--mint), var(--mint-deep)); color:#fff; }
  .node .wn{ font-family:'Quicksand'; font-weight:600; font-size:12.5px; }
  .node .wd{ font-family:'JetBrains Mono'; font-size:8.5px; color: var(--ink-soft); display:block; }

  .panel{ flex:1; min-width:0; }
  .view{ display:none; }
  .view.active{ display:block; }

  .head-card{ padding: 20px 24px; margin-bottom: 16px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; }
  .head-card h2{ font-family:'Quicksand'; font-weight:700; font-size:21px; margin:0 0 4px; }
  .head-card .sub{ font-family:'JetBrains Mono'; font-size:11px; color: var(--ink-soft); }
  .week-progress-wrap{ display:flex; align-items:center; gap:10px; }
  .week-bar{ width:130px; height:9px; background: rgba(150,110,160,0.15); border-radius:6px; overflow:hidden; }
  .week-bar-fill{ height:100%; border-radius:6px; background: linear-gradient(90deg, var(--mint), var(--amber)); }
  .week-pct{ font-family:'JetBrains Mono'; font-size:11px; color: var(--ink-soft); }
  .cleared-pill{ font-family:'Quicksand'; font-weight:700; font-size:11.5px; color: #fff; background: linear-gradient(135deg, var(--mint-deep), var(--mint)); padding:5px 12px; border-radius:20px; }

  .card{ padding: 20px 24px; margin-bottom: 16px; }
  .card-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; flex-wrap:wrap; gap:8px; }
  .card-head h3{ font-family:'Quicksand'; font-weight:700; font-size:15px; margin:0; }
  .card-head .count{ font-family:'JetBrains Mono'; font-size:11px; color: var(--ink-soft); }

  .filter-select{
    font-family:'JetBrains Mono'; font-size:11px; color: var(--ink); background: rgba(255,255,255,0.55);
    border:1px solid rgba(150,110,160,0.25); padding:6px 10px; border-radius:10px; cursor:pointer;
  }

  .wk-add-row{ display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .wk-add-row input[type=text]{ flex:1; min-width:160px; border:1px solid rgba(150,110,160,0.25); background: rgba(255,255,255,0.55); padding:10px 14px; font-family:'Inter'; font-size:13.5px; border-radius: 12px; color: var(--ink); }
  .wk-add-row select, .wk-add-row input[type=date]{ border:1px solid rgba(150,110,160,0.25); background: rgba(255,255,255,0.55); padding:9px 10px; font-family:'JetBrains Mono'; font-size:12px; border-radius: 12px; color: var(--ink); }
  .wk-add-row button{ background: linear-gradient(135deg, var(--amber), var(--rose)); color:#fff; border:none; padding: 0 18px; font-family:'Quicksand'; font-weight:700; font-size:13px; border-radius: 12px; cursor:pointer; }

  .wk-task{ display:flex; align-items:flex-start; gap:10px; padding: 10px 8px; margin-bottom:6px; border-radius:12px; background: rgba(255,255,255,0.3); border:1px solid rgba(255,255,255,0.4); }
  .wk-task.done{ background: rgba(143,220,196,0.22); border-color: rgba(92,190,158,0.35); color: var(--ink-soft); }
  .wk-task.done .txt{ text-decoration: line-through; }
  .wk-task.sup{ background: rgba(217,154,62,0.12); border-color: rgba(217,154,62,0.3); }
  .wk-task .dot{ width:9px; height:9px; border-radius:50%; margin-top:4px; flex-shrink:0; }
  .wk-task .body{ flex:1; min-width:0; }
  .wk-task .txt{ font-size:13px; word-break:break-word; }
  .wk-task .meta{ display:flex; gap:6px; margin-top:4px; flex-wrap:wrap; }
  .pri-tag{ font-family:'JetBrains Mono'; font-size:8.5px; padding:2px 7px; border-radius:10px; text-transform:uppercase; }
  .pri-low{ background: rgba(143,220,196,0.3); color: var(--mint-deep); }
  .pri-medium{ background: rgba(239,192,126,0.35); color: var(--amber-deep); }
  .pri-high{ background: rgba(232,145,126,0.35); color: var(--coral-deep); }
  .deadline-tag{ font-family:'JetBrains Mono'; font-size:8.5px; color: var(--ink-soft); background: rgba(150,110,160,0.12); padding:2px 7px; border-radius:10px; }
  .deadline-tag.overdue{ color: var(--coral-deep); background: rgba(232,145,126,0.22); }
  .status-tag{ font-family:'JetBrains Mono'; font-size:8.5px; padding:2px 7px; border-radius:10px; }
  .status-tag.pending{ background: rgba(217,118,158,0.18); color: var(--rose-deep); }
  .status-tag.completed{ background: rgba(92,190,158,0.2); color: var(--mint-deep); }
  .sup-tag{ font-family:'JetBrains Mono'; font-size:8px; color: var(--amber-deep); background: rgba(217,154,62,0.22); padding:2px 7px; border-radius:10px; }

  .skill-card{ padding: 16px 18px; margin-bottom:14px; }
  .skill-head{ display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:10px; gap:10px; }
  .skill-name{ font-family:'Quicksand'; font-weight:700; font-size:15px; }
  .skill-tier{ font-family:'JetBrains Mono'; font-size:9.5px; padding:3px 9px; border-radius:20px; text-transform:uppercase; background: rgba(169,139,219,0.25); color: var(--amethyst-deep); white-space:nowrap; }
  .skill-bar{ height:8px; background: rgba(150,110,160,0.15); border-radius:6px; overflow:hidden; margin-bottom:12px; }
  .skill-bar-fill{ height:100%; border-radius:6px; background: linear-gradient(90deg, var(--amethyst), var(--rose), var(--amber)); }
  .entry{ display:flex; gap:10px; padding: 7px 2px; border-bottom:1px solid rgba(150,110,160,0.12); }
  .entry:last-child{ border-bottom:none; }
  .entry .edate{ font-family:'JetBrains Mono'; font-size:9.5px; color: var(--ink-soft); flex-shrink:0; width:64px; padding-top:1px; }
  .entry .enote{ font-size:12.5px; flex:1; }
  .empty{ font-family:'JetBrains Mono'; font-size:11.5px; color: var(--ink-soft); padding: 6px 2px; }

  .reflect-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:14px; }
  .reflect-block .rlabel{ font-family:'Quicksand'; font-weight:700; font-size:12.5px; margin-bottom:8px; }
  .reflect-block p{ font-size:13px; white-space:pre-wrap; margin:0; }
  @media (max-width: 640px){ .reflect-grid{ grid-template-columns: 1fr; } }

  .comment{ display:flex; gap:10px; padding: 9px 2px; border-bottom:1px solid rgba(150,110,160,0.12); }
  .comment:last-child{ border-bottom:none; }
  .comment .cavatar{ width:26px; height:26px; border-radius:50%; flex-shrink:0; background: linear-gradient(135deg, var(--amber), var(--rose)); display:flex; align-items:center; justify-content:center; font-size:12px; }
  .comment .cbody{ flex:1; min-width:0; }
  .comment .cmeta{ font-family:'JetBrains Mono'; font-size:9px; color: var(--ink-soft); margin-bottom:2px; }
  .comment .ctext{ font-size:12.5px; white-space:pre-wrap; }

  .comment-form select{ width:100%; border:1px solid rgba(150,110,160,0.25); background: rgba(255,255,255,0.55); padding:8px 10px; font-family:'JetBrains Mono'; font-size:11px; border-radius:10px; margin-bottom:8px; }
  .comment-form textarea{ width:100%; border:1px solid rgba(150,110,160,0.25); background: rgba(255,255,255,0.55); padding:10px; font-family:'Inter'; font-size:12.5px; border-radius:10px; min-height:70px; resize:vertical; margin-bottom:8px; }
  .comment-form button{ background: linear-gradient(135deg, var(--rose), var(--amethyst)); color:#fff; border:none; padding:9px 18px; font-family:'Quicksand'; font-weight:700; font-size:12.5px; border-radius:10px; cursor:pointer; }

  .toast{ position: fixed; top: 26px; right: 26px; z-index: 50; padding: 14px 20px; border-radius:14px; background: linear-gradient(135deg, var(--mint), var(--mint-deep)); color:#fff; font-family:'Quicksand'; font-weight:700; font-size:12.5px; transform: translateX(140%); transition: transform .35s ease; }
  .toast.show{ transform: translateX(0); }
  .loading, .empty-page{ font-family:'JetBrains Mono'; font-size:12px; color: var(--ink-soft); text-align:center; padding:60px 10px; }

  @media (max-width: 900px){
    .layout{ flex-direction:column; }
    .week-rail{ width:100%; max-height:none; }
    .path{ display:flex; flex-wrap:wrap; padding-left:0; }
    .path::before{ display:none; }
  }
</style>
</head>
<body>
<div class="app" id="app">
  <div class="loading">Loading progress…</div>
</div>
<div class="toast" id="toast"></div>

<script>
const XP_PER_TASK = 10, XP_PER_LEVEL = 200, WEEK_CLEAR_BONUS = 50, XP_PER_ENTRY = 15;
const RANKS = [
  {min:1, title:'Rookie Intern'}, {min:3, title:'Intern'}, {min:5, title:'Skilled Intern'},
  {min:8, title:'Senior Intern'}, {min:11, title:'Team Contributor'}, {min:15, title:'Intern Legend'}
];
const SKILL_TIERS = [
  {min:0, title:'Untouched'}, {min:1, title:'Novice'}, {min:3, title:'Apprentice'},
  {min:6, title:'Practitioner'}, {min:10, title:'Skilled'}, {min:15, title:'Expert'}
];
const MONTH_NAMES = ['January','February','March','April','May','June','July','August','September','October','November','December'];

// Must match the FIREBASE_CONFIG in the main tracker exactly.
const FIREBASE_CONFIG = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
  projectId: "YOUR_PROJECT"
};
firebase.initializeApp(FIREBASE_CONFIG);
const db = firebase.database();

const trackerId = new URLSearchParams(location.search).get('tracker');
let state = null, supervisorWeeklyTasks = {}, comments = {};
let currentWeekId = null;
let currentView = 'tasks';
let weeklyFilter = 'all';
let monthCursor = new Date();

function fmtDate(d){ return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' }); }
function fmtDateFull(d){ return d.toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' }); }
function pad2(n){ return String(n).padStart(2,'0'); }
function isoOf(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
function uid(){ return Math.random().toString(36).slice(2,10); }
function escapeHtml(str){ const d = document.createElement('div'); d.textContent = str||''; return d.innerHTML; }
function showToast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); }

function rankForLevel(level){ let title = RANKS[0].title; RANKS.forEach(r => { if(level >= r.min) title = r.title; }); return title; }
function skillTierInfo(count){
  let idx = 0;
  for(let i=0;i<SKILL_TIERS.length;i++){ if(count >= SKILL_TIERS[i].min) idx = i; }
  const cur = SKILL_TIERS[idx], next = SKILL_TIERS[idx+1];
  const pct = next ? Math.min(100, Math.round(((count - cur.min) / (next.min - cur.min)) * 100)) : 100;
  return { title: cur.title, pct };
}
function supWeeklyForWeek(w){
  return Object.entries(supervisorWeeklyTasks||{}).filter(([id,t])=>t.weekId===w.id).map(([id,t])=>({id,...t}));
}
function computeXP(){
  let xp = 0;
  state.weeks.forEach(w => {
    const dayTasks = w.days.flatMap(d=>d.tasks||[]);
    xp += dayTasks.filter(t=>t.done).length * XP_PER_TASK;
    xp += (w.weeklyTasks||[]).filter(t=>t.done).length * XP_PER_TASK;
    if(w.cleared) xp += WEEK_CLEAR_BONUS;
  });
  (state.skills||[]).forEach(s => xp += (s.entries||[]).length * XP_PER_ENTRY);
  xp += Object.values(supervisorWeeklyTasks || {}).filter(t=>t.done).length * XP_PER_TASK;
  return xp;
}
function computeStreak(){
  const sorted = [...state.weeks].sort((a,b)=> b.weekNum - a.weekNum);
  const today = isoOf(new Date());
  let streak = 0;
  for(const w of sorted){ if(w.start > today) continue; if(w.cleared) streak++; else break; }
  return streak;
}
function weekStats(w){
  const dayTasks = w.days.flatMap(d=>d.tasks||[]);
  const weeklyOwn = w.weeklyTasks||[];
  const weeklySup = supWeeklyForWeek(w);
  const total = dayTasks.length + weeklyOwn.length + weeklySup.length;
  const done = dayTasks.filter(t=>t.done).length + weeklyOwn.filter(t=>t.done).length + weeklySup.filter(t=>t.done).length;
  return { total, done, pct: total ? Math.round((done/total)*100) : 0 };
}
function buildDateIndex(){
  const idx = {};
  state.weeks.forEach(w => { w.days.forEach(day => { idx[day.date] = { weekId: w.id, tasks: day.tasks }; }); });
  return idx;
}
function currentWeek(){ return state.weeks.find(w => w.id === currentWeekId); }

function shell(){
  const xp = computeXP();
  const level = Math.floor(xp / XP_PER_LEVEL) + 1;
  const inLevel = xp % XP_PER_LEVEL;
  const circ = 125.6;
  const off = circ - (circ * inLevel/XP_PER_LEVEL);

  return `
    <div class="banner glass"><span class="live-dot"></span> Live view <div>

    <div class="topbar glass">
      <div class="brand">
        <div class="orb"></div>
        <div><h1>Internship Quest</h1><div class="tag">Shared with you</div></div>
      </div>
      <div class="stats-row">
        <div class="level-badge">
          <div class="level-ring">
            <svg width="48" height="48" viewBox="0 0 48 48">
              <circle cx="24" cy="24" r="20" fill="none" stroke="rgba(150,110,160,0.18)" stroke-width="5"/>
              <circle cx="24" cy="24" r="20" fill="none" stroke="url(#gradRing)" stroke-width="5" stroke-dasharray="${circ}" stroke-dashoffset="${off}" stroke-linecap="round" transform="rotate(-90 24 24)"/>
              <defs><linearGradient id="gradRing" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#ECA6C4"/><stop offset="100%" stop-color="#A98BDB"/></linearGradient></defs>
            </svg>
            <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-family:'Quicksand'; font-weight:700; font-size:14px; color:var(--amethyst-deep);">${level}</div>
          </div>
          <div class="level-text"><div class="lt-top">${rankForLevel(level)}</div><div class="lt-sub">${inLevel} / ${XP_PER_LEVEL} XP</div></div>
        </div>
        <div class="streak-badge"><span>🔥</span><span>${computeStreak()} week streak</span></div>
      </div>
    </div>

    <div class="nav-pills">
      <button data-view="tasks" class="${currentView==='tasks'?'active':''}">Quest log</button>
      <button data-view="skills" class="${currentView==='skills'?'active':''}">Skill journal</button>
    </div>

    <div class="layout">
      <aside class="week-rail glass">
        <div class="side-tabs">
          <button class="side-tab active" data-side="map">Map</button>
          <button class="side-tab" data-side="calendar">Calendar</button>
        </div>
        <div class="side-view active" id="sideMap"><div class="path" id="weekList"></div></div>
        <div class="side-view" id="sideCalendar">
          <div class="cal-nav"><button id="calPrev">‹</button><span id="calLabel"></span><button id="calNext">›</button></div>
          <div class="cal-grid" id="calGrid"></div>
          <div class="deadline-list-wrap"><h4>Upcoming deadlines</h4><div id="deadlineList"></div></div>
        </div>
      </aside>

      <div class="panel">
        <section class="view ${currentView==='tasks'?'active':''}" id="view-tasks"></section>
        <section class="view ${currentView==='skills'?'active':''}" id="view-skills"></section>
      </div>
    </div>
  `;
}

function render(){
  const app = document.getElementById('app');
  if(!trackerId){ app.innerHTML = '<div class="empty-page">No report specified. Ask for a link that includes ?tracker=…</div>'; return; }
  if(!state){ app.innerHTML = '<div class="loading">Loading progress…</div>'; return; }

  if(!currentWeekId || !state.weeks.some(w=>w.id===currentWeekId)){
    const today = isoOf(new Date());
    const match = state.weeks.find(w => today >= w.start && today <= w.end);
    currentWeekId = (match || state.weeks[0]).id;
  }

  app.innerHTML = shell();

  document.querySelectorAll('.nav-pills button').forEach(btn => {
    btn.addEventListener('click', () => { currentView = btn.dataset.view; render(); });
  });
  document.querySelectorAll('.side-tab').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.side-tab').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      document.querySelectorAll('.side-view').forEach(v=>v.classList.remove('active'));
      document.getElementById(btn.dataset.side === 'map' ? 'sideMap' : 'sideCalendar').classList.add('active');
    });
  });
  document.getElementById('calPrev').addEventListener('click', () => { monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth()-1, 1); renderCalendar(); });
  document.getElementById('calNext').addEventListener('click', () => { monthCursor = new Date(monthCursor.getFullYear(), monthCursor.getMonth()+1, 1); renderCalendar(); });

  renderWeekList();
  renderCalendar();
  renderDeadlineList();
  if(currentView === 'tasks') renderTasksView(); else renderSkillsView();
}

function renderWeekList(){
  const box = document.getElementById('weekList');
  box.innerHTML = '';
  state.weeks.forEach(w => {
    const el = document.createElement('div');
    el.className = 'node' + (w.id===currentWeekId ? ' active':'') + (w.cleared ? ' cleared':'');
    el.innerHTML = `<div class="circ">${w.cleared ? '✓' : w.weekNum}</div><div><span class="wn">Week ${w.weekNum}</span><span class="wd">${fmtDate(new Date(w.start+'T00:00:00'))}</span></div>`;
    el.addEventListener('click', ()=>{ currentWeekId = w.id; currentView = 'tasks'; render(); });
    box.appendChild(el);
  });
}

function renderCalendar(){
  const grid = document.getElementById('calGrid');
  if(!grid) return;
  document.getElementById('calLabel').textContent = MONTH_NAMES[monthCursor.getMonth()] + ' ' + monthCursor.getFullYear();
  const idx = buildDateIndex();
  const today = isoOf(new Date());
  grid.innerHTML = '';
  ['Mo','Tu','We','Th','Fr','Sa','Su'].forEach(wd => { const el=document.createElement('div'); el.className='cal-wd'; el.textContent=wd; grid.appendChild(el); });
  const first = new Date(monthCursor.getFullYear(), monthCursor.getMonth(), 1);
  const dow = (first.getDay()+6)%7;
  const gridStart = new Date(first); gridStart.setDate(first.getDate()-dow);
  const cw = currentWeek();
  for(let i=0;i<42;i++){
    const d = new Date(gridStart); d.setDate(gridStart.getDate()+i);
    const iso = isoOf(d);
    const inMonth = d.getMonth() === monthCursor.getMonth();
    const entry = idx[iso];
    const cell = document.createElement('div');
    let cls = 'cal-day' + (inMonth?'':' out-month') + (iso===today?' today':'');
    let dotHtml = '';
    if(entry && entry.tasks.length){
      cls += ' has-tasks';
      if(cw && entry.weekId===cw.id) cls += ' cur-week';
      const allDone = entry.tasks.every(t=>t.done);
      if(allDone){ cls += ' all-done'; dotHtml = '<span class="cal-dot dot-done"></span>'; }
      else {
        const order={high:0,medium:1,low:2};
        const top = [...entry.tasks].filter(t=>!t.done).sort((a,b)=>order[a.priority]-order[b.priority])[0];
        dotHtml = `<span class="cal-dot dot-${top.priority}"></span>`;
      }
    }
    cell.className = cls;
    cell.innerHTML = `${d.getDate()}${dotHtml}`;
    if(entry){ cell.addEventListener('click', ()=>{ currentWeekId = entry.weekId; currentView='tasks'; render(); }); }
    grid.appendChild(cell);
  }
}

function renderDeadlineList(){
  const box = document.getElementById('deadlineList');
  if(!box) return;
  const today = isoOf(new Date());
  const items = [];
  state.weeks.forEach(w => {
    (w.weeklyTasks||[]).forEach(t => {
      if(t.deadline && !t.done) items.push({ date: t.deadline, priority: t.priority, text: t.text, weekId: w.id });
    });
  });
  items.sort((a,b)=> a.date.localeCompare(b.date));
  if(items.length === 0){ box.innerHTML = '<div class="deadline-empty">No upcoming deadlines set.</div>'; return; }
  box.innerHTML = items.slice(0,10).map(it => {
    const overdue = it.date < today;
    return `<div class="deadline-item${overdue?' overdue':''}" data-week="${it.weekId}">
      <span class="dl-date">${fmtDate(new Date(it.date+'T00:00:00'))}</span>
      <span class="dl-dot dot-${it.priority}"></span>
      <div class="dl-body"><div class="dl-text">${escapeHtml(it.text)}</div><div class="dl-time">${overdue?'overdue':'upcoming'}</div></div>
    </div>`;
  }).join('');
  box.querySelectorAll('.deadline-item').forEach(el => {
    el.addEventListener('click', () => { currentWeekId = el.dataset.week; currentView='tasks'; render(); });
  });
}

function renderWeeklyTasks(container, w){
  const own = (w.weeklyTasks||[]).map(t => ({...t, _kind:'own'}));
  const sup = supWeeklyForWeek(w).map(t => ({...t, _kind:'sup'}));
  let merged = [...own, ...sup];
  const totalCount = merged.length;

  if(weeklyFilter === 'pending') merged = merged.filter(t => !t.done);
  else if(weeklyFilter === 'completed') merged = merged.filter(t => t.done);

  const order = {high:0, medium:1, low:2};
  merged.sort((a,b) => order[a.priority||'medium']-order[b.priority||'medium']);

  const today = isoOf(new Date());
  const listHtml = merged.length === 0 ? '<div class="empty">No tasks match this filter.</div>' :
    merged.map(t => {
      const overdue = t.deadline && t.deadline < today && !t.done;
      const dotColor = t._kind==='sup' ? 'var(--amber-deep)' : (t.priority==='high'?'var(--coral-deep)':t.priority==='low'?'var(--mint-deep)':'var(--amber-deep)');
      return `<div class="wk-task${t.done?' done':''}${t._kind==='sup'?' sup':''}">
        <span class="dot" style="background:${dotColor};"></span>
        <div class="body">
          <span class="txt">${escapeHtml(t.text)}</span>
          <div class="meta">
            <span class="pri-tag pri-${t.priority||'medium'}">${t.priority||'medium'}</span>
            ${t.deadline ? `<span class="deadline-tag${overdue?' overdue':''}">${overdue?'overdue · ':''}due ${fmtDate(new Date(t.deadline+'T00:00:00'))}</span>` : ''}
            <span class="status-tag ${t.done?'completed':'pending'}">${t.done?'completed':'pending'}</span>
            ${t._kind==='sup' ? '<span class="sup-tag">👤 you added</span>' : ''}
          </div>
        </div>
      </div>`;
    }).join('');

  container.innerHTML = `
    <div class="card-head">
      <h3>📋 Weekly Tasks <span class="count">${totalCount}</span></h3>
      <select class="filter-select" id="weeklyFilterSel">
        <option value="all" ${weeklyFilter==='all'?'selected':''}>All</option>
        <option value="pending" ${weeklyFilter==='pending'?'selected':''}>Pending</option>
        <option value="completed" ${weeklyFilter==='completed'?'selected':''}>Completed</option>
      </select>
    </div>
    <form class="wk-add-row" id="weeklyAddForm">
      <input type="text" id="weeklyText" placeholder="Add a task for her…" maxlength="140" required>
      <select id="weeklyPriority">
        <option value="low">Low</option>
        <option value="medium" selected>Medium</option>
        <option value="high">High</option>
      </select>
      <input type="date" id="weeklyDeadline">
      <button type="submit">Add</button>
    </form>
    <div id="weeklyTaskList">${listHtml}</div>
  `;

  document.getElementById('weeklyFilterSel').addEventListener('change', (e) => {
    weeklyFilter = e.target.value;
    renderWeeklyTasks(container, w);
  });
  document.getElementById('weeklyAddForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const text = document.getElementById('weeklyText').value.trim();
    if(!text) return;
    const priority = document.getElementById('weeklyPriority').value;
    const deadline = document.getElementById('weeklyDeadline').value;
    db.ref('trackers/' + trackerId + '/supervisorWeeklyTasks/' + uid()).set({
      text, priority, deadline, weekId: w.id, weekNum: w.weekNum, done:false, addedBy:'supervisor', createdAt: Date.now()
    }).then(()=> showToast('Task added ✓')).catch(err => showToast('Could not add task: ' + err.message));
    e.target.reset();
  });
}

function renderTasksView(){
  const w = currentWeek();
  const section = document.getElementById('view-tasks');
  const {total, done, pct} = weekStats(w);

  let html = `
    <div class="head-card glass">
      <div><h2>Week ${w.weekNum}</h2><div class="sub">${fmtDateFull(new Date(w.start+'T00:00:00'))} – ${fmtDateFull(new Date(w.end+'T00:00:00'))}</div></div>
      <div class="week-progress-wrap">
        <div class="week-bar"><div class="week-bar-fill" style="width:${pct}%"></div></div>
        <span class="week-pct">${done} / ${total} done</span>
        ${w.cleared ? '<span class="cleared-pill">Cleared ✓</span>' : ''}
      </div>
    </div>
    <div class="card glass" id="weeklyTasksCard"></div>
  `;

  if(w.reflection && (w.reflection.did || w.reflection.learned)){
    html += `<div class="card glass"><div class="card-head"><h3>Her weekly reflection</h3></div><div class="reflect-grid">`;
    html += `<div class="reflect-block"><div class="rlabel">📝 What she did</div><p>${w.reflection.did ? escapeHtml(w.reflection.did) : '<span class="empty">Nothing written yet.</span>'}</p></div>`;
    html += `<div class="reflect-block"><div class="rlabel">💡 What she learned</div><p>${w.reflection.learned ? escapeHtml(w.reflection.learned) : '<span class="empty">Nothing written yet.</span>'}</p></div>`;
    html += `</div></div>`;
  }

  const commentList = Object.entries(comments||{}).map(([id,c])=>({id,...c})).sort((a,b)=>(b.createdAt||0)-(a.createdAt||0));
  html += `<div class="card glass">
    <div class="card-head"><h3>💬 Comments</h3><span class="count">${commentList.length}</span></div>
    ${commentList.length === 0 ? '<div class="empty">No comments yet — leave the first one below.</div>' :
      commentList.map(c => `
        <div class="comment">
          <div class="cavatar">👤</div>
          <div class="cbody">
            <div class="cmeta">${c.weekNum ? 'On Week ' + c.weekNum + ' · ' : ''}${c.createdAt ? new Date(c.createdAt).toLocaleString('en-GB',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}) : ''}</div>
            <div class="ctext">${escapeHtml(c.text)}</div>
          </div>
        </div>
      `).join('')
    }
    <form class="comment-form" id="commentForm" style="margin-top:14px; padding-top:14px; border-top:1px solid rgba(150,110,160,0.15);">
      <select id="commentWeek">
        ${state.weeks.map(wk => `<option value="${wk.weekNum}" ${wk.id===currentWeekId?'selected':''}>Week ${wk.weekNum}</option>`).join('')}
      </select>
      <textarea id="commentText" placeholder="Leave a comment or piece of feedback…" required></textarea>
      <button type="submit">Post comment</button>
    </form>
  </div>`;

  section.innerHTML = html;
  renderWeeklyTasks(document.getElementById('weeklyTasksCard'), w);

  const cForm = document.getElementById('commentForm');
  if(cForm){
    cForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = document.getElementById('commentText').value.trim();
      const weekNum = parseInt(document.getElementById('commentWeek').value, 10);
      if(!text) return;
      db.ref('trackers/' + trackerId + '/comments/' + uid()).set({ text, weekNum, createdAt: Date.now() })
        .then(()=> showToast('Comment posted ✓')).catch(err => showToast('Could not post: ' + err.message));
      cForm.reset();
    });
  }
}

function renderSkillsView(){
  const section = document.getElementById('view-skills');
  let html = `<div class="head-card glass"><div><h2>Skill journal</h2><div class="sub">What she's been learning across the internship</div></div></div>`;
  const skills = state.skills || [];
  if(skills.length === 0){
    html += `<div class="card glass empty">No skills logged yet.</div>`;
  } else {
    skills.forEach(s => {
      const tier = skillTierInfo((s.entries||[]).length);
      const entriesSorted = [...(s.entries||[])].sort((a,b)=> b.date.localeCompare(a.date));
      html += `<div class="skill-card glass">
        <div class="skill-head"><span class="skill-name">💠 ${escapeHtml(s.name)}</span><span class="skill-tier">${tier.title}</span></div>
        <div class="skill-bar"><div class="skill-bar-fill" style="width:${tier.pct}%"></div></div>
        <div class="entries">
          ${entriesSorted.length === 0 ? '<div class="empty">No entries logged yet.</div>' :
            entriesSorted.map(en => `<div class="entry"><span class="edate">${fmtDate(new Date(en.date+'T00:00:00'))}</span><span class="enote">${escapeHtml(en.note)}</span></div>`).join('')}
        </div>
      </div>`;
    });
  }
  section.innerHTML = html;
}

function buildDisplayState(raw){
  if(!raw || !Array.isArray(raw.weeks)) return null;
  raw.weeks.forEach(w => {
    if(!w.reflection) w.reflection = { did:'', learned:'' };
    if(!Array.isArray(w.weeklyTasks)) w.weeklyTasks = [];
  });
  if(!Array.isArray(raw.skills)) raw.skills = [];
  return raw;
}

if(!trackerId){
  document.getElementById('app').innerHTML = '<div class="empty-page">No report specified. Ask for a link that includes ?tracker=…</div>';
} else {
  db.ref('trackers/' + trackerId + '/state').on('value', (snap) => {
    state = buildDisplayState(snap.val());
    render();
  }, () => { document.getElementById('app').innerHTML = '<div class="empty-page">Could not load this report.</div>'; });

  db.ref('trackers/' + trackerId + '/supervisorWeeklyTasks').on('value', (snap) => {
    supervisorWeeklyTasks = snap.val() || {};
    if(state) render();
  });
  db.ref('trackers/' + trackerId + '/comments').on('value', (snap) => {
    comments = snap.val() || {};
    if(state) render();
  });
}
</script>
</body>
</html>
